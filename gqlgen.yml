schema:
  - api/graphql/*.graphqls

exec:
  filename: internal/graph/generated/generated.go
  package: generated

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph

autobind:
  - "github.com/monis/twitter-backend-go/internal/graph/model"
